name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Protocol contract tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows development tools
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-p0-development
          path: |
            build/Release/PhoneMirror.exe
            build/Release/pm-inspect.exe
            build/Release/pm-playback-check.exe
            build/Release/pm-live-check.exe
            scripts/start-usb.ps1
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse development-only signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-mirror-debug-signing-v1
      - name: Android unit tests, lint and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-p0-capture-probe
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
