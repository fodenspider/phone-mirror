name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Protocol contract tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows development tools
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-p0-development
          path: |
            build/Release/PhoneMirror.exe
            build/Release/pm-inspect.exe
            build/Release/pm-playback-check.exe
            build/Release/pm-live-check.exe
            scripts/start-usb.ps1
          if-no-files-found: error
  package:
    needs: [desktop, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-p0-development
          path: incoming/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-p0-capture-probe
          path: incoming/android
      - name: Assemble preview distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/companion, stage/scripts, dist | Out-Null
          $desktop = @(Get-ChildItem incoming/windows -Recurse -Filter PhoneMirror.exe)
          $android = @(Get-ChildItem incoming/android -Recurse -Filter app-debug.apk)
          if ($desktop.Count -ne 1 -or $android.Count -ne 1) { throw 'Ambiguous build artifacts' }
          Copy-Item $desktop[0].FullName stage/PhoneMirror.exe
          Copy-Item $android[0].FullName stage/companion/phone-mirror.apk
          Copy-Item scripts/import-components.ps1 stage/scripts/
          Copy-Item docs/quick-start.md stage/README.md
          Copy-Item docs/dependencies.md stage/DEPENDENCIES.md
          $stage = (Resolve-Path stage).Path
          $output = (Resolve-Path dist).Path
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DStageDir=$stage" "/DOutputDir=$output" packaging/windows/phone-mirror.iss
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          Compress-Archive stage/* dist/PhoneMirror-0.6.1-preview-portable.zip
      - name: Verify install, startup and uninstall on disposable runner
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'PhoneMirror-install-test'
          $setup = (Resolve-Path dist/*setup.exe).Path
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $destination + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'Installation failed' }
          foreach ($file in @('PhoneMirror.exe','companion/phone-mirror.apk','scripts/import-components.ps1')) {
            if (!(Test-Path (Join-Path $destination $file))) { throw "Missing $file" }
          }
          $p = Start-Process (Join-Path $destination 'PhoneMirror.exe') -ArgumentList '--ui-smoke' -WindowStyle Hidden -PassThru
          if (!$p.WaitForExit(10000)) { $p.Kill(); throw 'UI startup timeout' }
          if ($p.ExitCode) { throw 'UI startup failed' }
          # Reinstall the same version and preserve per-user preferences.
          $preferences = Join-Path $env:LOCALAPPDATA 'PhoneMirror/settings.txt'
          New-Item -ItemType Directory -Force (Split-Path $preferences) | Out-Null
          Set-Content $preferences 'quality 2'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $destination + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -or (Get-Content $preferences -Raw).Trim() -ne 'quality 2') { throw 'Reinstall changed preferences' }
          $p = Start-Process (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -or (Test-Path (Join-Path $destination 'PhoneMirror.exe'))) { throw 'Uninstall failed' }
          if ((Get-Content $preferences -Raw).Trim() -ne 'quality 2') { throw 'Uninstall removed user preferences' }
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-mirror-preview
          path: dist/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse development-only signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-mirror-debug-signing-v1
      - name: Android unit tests, lint and debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-p0-capture-probe
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
